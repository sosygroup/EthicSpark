name: Catalogue foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix desktop
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test against PostgreSQL using Java 25
        run: ./scripts/test.sh
      - name: Build runtime image
        run: docker build -t ethics-catalogue:ci .
